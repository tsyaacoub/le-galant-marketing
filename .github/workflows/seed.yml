# One-off: turns data/calendar.local.json into issues (used to load month one). Safe to re-run: skips ids that exist.
name: seed
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run seed
        env:
          STORE: github
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
